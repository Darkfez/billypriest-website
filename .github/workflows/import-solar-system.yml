name: Import missing solar-system page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-solar-system.yml'

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[skip solar sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download live solar-system page
        run: |
          curl --fail --silent --show-error --location https://billypriest.com/solar-system.html -o solar-system.html
          test "$(wc -c < solar-system.html)" -gt 100000
          grep -q '__bundler/manifest' solar-system.html

      - name: Commit imported page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solar-system.html
          git diff --cached --quiet && exit 0
          git commit -m "Add solar system standalone page [skip solar sync]"
          git push
