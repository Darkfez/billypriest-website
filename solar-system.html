  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-size:15px;line-height:1.65;color:#c7cede;\">{{ selectedFunFact }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ !loaded }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05070d;color:#8792a6;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.08em;\">\n      Loading solar system…\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot;}, &quot;showAsteroidBelt&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scene&quot;}, &quot;showOrbitRings&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scene&quot;}}\">\nconst PLANETS = [\n  { key:'mercury', name:'Mercury', colorHex:'#9c9c9c', colorLight:'#c9c9c9', size:0.55, orbitRadius:7, orbitSpeed:0.42, rotationSpeed:0.2, hasRing:false, moons:[],\n    facts:{ diameter:'4,879 km', distance:'57.9 million km (0.39 AU)', day:'59 Earth days', year:'88 Earth days', moons:0,\n      funFact:'Mercury swings between -180°C and 430°C — the most extreme temperature range of any planet.' } },\n  { key:'venus', name:'Venus', colorHex:'#e8c88f', colorLight:'#f4dfb0', size:0.85, orbitRadius:9.5, orbitSpeed:0.34, rotationSpeed:-0.1, hasRing:false, moons:[],\n    facts:{ diameter:'12,104 km', distance:'108.2 million km (0.72 AU)', day:'243 Earth days', year:'225 Earth days', moons:0,\n      funFact:'Venus spins backwards and its day is longer than its year, thanks to a thick, crushing CO2 atmosphere.' } },\n  { key:'earth', name:'Earth', colorHex:'#4a90d9', colorLight:'#7ec8f0', size:0.9, orbitRadius:12, orbitSpeed:0.27, rotationSpee funFact:'Uranus rotates almost completely on its side, likely the result of an ancient collision.' } },\n  { key:'neptune', name:'Neptune', colorHex:'#3f5fd9', colorLight:'#7a94f0', size:1.55, orbitRadius:33, orbitSpeed:0.06, rotationSpeed:1.05, hasRing:false, moons:[{size:0.22,dist:2.6,speed:0.55}],\n    facts:{ diameter:'49,244 km', distance:'4.5 billion km (30.1 AU)', day:'16 hours', year:'165 Earth years', moons:16,\n      funFact:'Neptune has the strongest winds in the solar system — gusts up to 2,100 km/h.' } },\n];\n\nclass Component extends DCLogic {\n  state = { selectedKey: null, speed: 1, loaded: false, hoverKey: null, hoverX: 0, hoverY: 0 };\n\n  setMount = (el) => {\n    if (el && el !== this.mountEl) {\n      this.mountEl = el;\n      this.waitForThree();\n    }\n  };\n\n  waitForThree(retries = 0) {\n    if (window.THREE && window.THREE.OrbitControls) {\n      this.initScene();\n    } else if (retries < 400) {\n      setTimeout(() => this.waitForThree(retries + 1), 25);\n    } else {\n      console.error('THREE / OrbitControls failed to load');\n      this.setState({ loaded: true });\n    }\n  }\n\n  makeGlowTexture(THREE) {\n    const size = 256;\n    const canvas = document.createElement('canvas');\n    canvas.width = size; canvas.height = size;\n    const ctx = canvas.getContext('2d');\n    const grd = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);\n    grd.addColorStop(0, 'rgba(255,224,160,0.95)');\n    grd.addColorStop(0.4, 'rgba(255,190,110,0.35)');\n    grd.addColorStop(1, 'rgba(255,180,90,0)');\n    ctx.fillStyle = grd;\n    ctx.fillRect(0, 0, size, size);\n    const tex = new THREE.CanvasTexture(canvas);\n    tex.needsUpdate = true;\n    return tex;\n  }\n\n  initScene() {\n    try {\n      this._initSceneInner();\n    } catch (err) {\n      console.error('initScene failed', err);\n      this.setState({ loaded: true });\n    }\n  }\n\n  _initSceneInner() {\n    const THREE = window.THREE;\n    if (!THREE) { console.error('THREE not loaded'); this.setState({ loaded: true }); return; }\n    this.THREE = THREE;\n    const mount = this.mountEl;\n    const width = mount.clientWidth || window.innerWidth || 800;\n    const height = mount.clientHeight || window.innerHeight || 600;\n\n    const scene = new THREE.Scene();\n    scene.background = new THREE.Color('#05070d');\n    scene.fog = new THREE.FogExp2(0x05070d, 0.0055);\n\n    const camera = new THREE.PerspectiveCamera(48, width / height, 0.1, 2000);\n    camera.position.set(0, 22, 46);\n    this.overviewCamPos = camera.position.clone();\n    this.overviewTarget = new THREE.Vector3(0, 0, 0);\n\n    const renderer = new THREE.WebGLRenderer({ antialias: true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.setSize(width, height);\n    mount.appendChild(renderer.domElement);\n\n    const controls = new THREE.OrbitControls(camera, renderer.domElement);\n    controls.enableDamping = true;\n    controls.dampingFactor = 0.08;\n    controls.minDistance = 6;\n    controls.maxDistance = 130;\n    controls.target.copy(this.overviewTarget);\n\n    scene.add(new THREE.AmbientLight('#445577', 0.35));\n    scene.add(new THREE.PointLight('#fff2d1', 2.4, 0, 1.6));\n    scene.add(new THREE.HemisphereLight('#334466', '#0a0a12', 0.25));\n\n    const starCount = 2200;\n    const starGeo = new THREE.BufferGeometry();\n    const starPos = new Float32Array(starCount * 3);\n    for (let i = 0; i < starCount; i++) {\n      const r = 200 + Math.random() * 600;\n      const theta = Math.random() * Math.PI * 2;\n      const phi = Math.acos(Math.random() * 2 - 1);\n      starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);\n      starPos[i*3+1] = r * Math.cos(phi);\n      starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);\n    }\n    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));\n    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, sizeAttenuation: true, transparent: true, opacity: 0.85 })));\n\n    const sun = new THREE.Mesh(new THREE.SphereGeometry(3.2, 48, 48), new THREE.MeshBasicMaterial({ color: '#ffd27a' }));\n    scene.add(sun);\n    const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: this.makeGlowTexture(THREE), color: '#ffcf7a', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));\n    glowSprite.scale.set(16, 16, 1);\n    scene.add(glowSprite);\n\n    const showBelt = this.props.showAsteroidBelt ?? true;\n    const beltGroup = new THREE.Group();\n    if (showBelt) {\n      const asteroidGeo = new THREE.IcosahedronGeometry(0.09, 0);\n      const asteroidMat = new THREE.MeshStandardMaterial({ color: '#9c8f7e', roughness: 0.9 });\n      const asteroidCount = 260;\n      const asteroidMesh = new THREE.InstancedMesh(asteroidGeo, asteroidMat, asteroidCount);\n      const dummy = new THREE.Object3D();\n      for (let i = 0; i < asteroidCount; i++) {\n        const r = 16.2 + Math.random() * 1.6;\n        const a = Math.random() * Math.PI * 2;\n        const y = (Math.random() - 0.5) * 0.6;\n        dummy.position.set(Math.cos(a) * r, y, Math.sin(a) * r);\n        dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);\n        const s = 0.5 + Math.random() * 1.2;\n        dummy.scale.set(s, s, s);\n        dummy.updateMatrix();\n        asteroidMesh.setMatrixAt(i, dummy.matrix);\n      }\n      beltGroup.add(asteroidMesh);\n    }\n    scene.add(beltGroup);\n    this.beltGroup = beltGroup;\n\n    const showRings = this.props.showOrbitRings ?? true;\n    this.planetMeshes = {};\n    this.orbitGroups = {};\n\n    PLANETS.forEach(p => {\n      if (showRings) {\n        const segs = 128;\n        const ringPoints = [];\n        for (let i = 0; i <= segs; i++) {\n          const a = (i / segs) * Math.PI * 2;\n          ringPoints.push(new THREE.Vector3(Math.cos(a) * p.orbitRadius, 0, Math.sin(a) * p.orbitRadius));\n        }\n        const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPoints);\n        scene.add(new THREE.Line(ringGeo, new THREE.LineBasicMaterial({ color: p.colorHex, transparent: true, opacity: 0.22 })));\n      }\n\n      const orbitGroup = new THREE.Group();\n      orbitGroup.rotation.y = Math.random() * Math.PI * 2;\n      scene.add(orbitGroup);\n\n      const planetMesh = new THREE.Mesh(\n        new THREE.SphereGeometry(p.size, 40, 40),\n        new THREE.MeshStandardMaterial({ color: p.colorHex, roughness: 0.75, metalness: 0.05, emissive: p.colorHex, emissiveIntensity: 0.06 })\n      );\n      planetMesh.position.set(p.orbitRadius, 0, 0);\n      planetMesh.userData.key = p.key;\n      orbitGroup.add(planetMesh);\n\n      if (p.hasRing) {\n        const ringMesh = new THREE.Mesh(\n          new THREE.RingGeometry(p.size * 1.35, p.size * 2.3, 64),\n          new THREE.MeshBasicMaterial({ color: p.colorHex, transparent: true, opacity: 0.35, side: THREE.DoubleSide })\n        );\n        ringMesh.rotation.x = Math.PI / 2 - 0.35;\n        planetMesh.add(ringMesh);\n      }\n\n      (p.moons || []).forEach(m => {\n        const pivot = new THREE.Object3D();\n        pivot.rotation.y = Math.random() * Math.PI * 2;\n        pivot.userData.speed = m.speed;\n        planetMesh.add(pivot);\n        const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(m.size, 16, 16), new THREE.MeshStandardMaterial({ color: '#b7bcc9', roughness: 0.9 }));\n        moonMesh.position.set(m.dist, 0, 0);\n        pivot.add(moonMesh);\n      });\n\n      this.planetMeshes[p.key] = planetMesh;\n      this.orbitGroups[p.key] = orbitGroup;\n    });\n\n    this.scene = scene;\n    this.camera = camera;\n    this.renderer = renderer;\n    this.controls = controls;\n    this.clock = new THREE.Clock();\n    this.raycaster = new THREE.Raycaster();\n    this.pointerNDC = new THREE.Vector2();\n    this.speedMultiplier = this.state.speed;\n\n    this.onResize = () => {\n      const w = mount.clientWidth, h = mount.clientHeight;\n      if (!w || !h) return;\n      camera.aspect = w / h;\n      camera.updateProjectionMatrix();\n      renderer.setSize(w, h);\n    };\n    window.addEventListener('resize', this.onResize);\n    if (window.ResizeObserver) {\n      this.resizeObserver = new ResizeObserver(() => this.onResize());\n      this.resizeObserver.observe(mount);\n    } else {\n      requestAnimationFrame(this.onResize);\n      setTimeout(this.onResize, 150);\n    }\n\n    this._downPos = null;\n    this.onPointerDown = (e) => { this._downPos = { x: e.clientX, y: e.clientY }; };\n    this.onPointerUp = (e) => {\n      if (!this._downPos) return;\n      const dx = e.clientX - this._downPos.x, dy = e.clientY - this._downPos.y;\n      this._downPos = null;\n      if (Math.sqrt(dx*dx + dy*dy) > 6) return;\n      const rect = renderer.domElement.getBoundingClientRect();\n      this.pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;\n      this.pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;\n      this.raycaster.setFromCamera(this.pointerNDC, camera);\n      const hits = this.raycaster.intersectObjects(Object.values(this.planetMeshes), true);\n      if (hits.length) {\n        let obj = hits[0].object;\n        while (obj && !obj.userData.key) obj = obj.parent;\n        if (obj) this.selectPlanet(obj.userData.key);\n      }\n    };\n    renderer.domElement.addEventListener('pointerdown', this.onPointerDown);\n    renderer.domElement.addEventListener('pointerup', this.onPointerUp);\n\n    this.onPointerMove = (e) => {\n      const rect = mount.getBoundingClientRect();\n      const ndc = new THREE.Vector2(\n        ((e.clientX - rect.left) / rect.width) * 2 - 1,\n        -((e.clientY - rect.top) / rect.height) * 2 + 1\n      );\n      this.raycaster.setFromCamera(ndc, camera);\n      const hits = this.raycaster.intersectObjects(Object.values(this.planetMeshes), true);\n      let key = null;\n      if (hits.length) {\n        let obj = hits[0].object;\n        while (obj && !obj.userData.key) obj = obj.parent;\n        if (obj) key = obj.userData.key;\n      }\n      const localX = e.clientX - rect.left;\n      const localY = e.clientY - rect.top;\n      if (key !== this.state.hoverKey || key) {\n        this.setState({ hoverKey: key, hoverX: localX, hoverY: localY });\n      }\n      renderer.domElement.style.cursor = key ? 'pointer' : 'grab';\n    };\n    renderer.domElement.addEventListener('pointermove', this.onPointerMove);\n\n    this.animate();\n    this.setState({ loaded: true });\n  }\n\n  animate = () => {\n    this.rafId = requestAnimationFrame(this.animate);\n    const THREE = this.THREE;\n    const dt = Math.min(this.clock.getDelta(), 0.05);\n    const t = dt * (this.speedMultiplier ?? 1);\n\n    PLANETS.forEach(p => {\n      this.orbitGroups[p.key].rotation.y += p.orbitSpeed * t;\n      const mesh = this.planetMeshes[p.key];\n      mesh.rotation.y += p.rotationSpeed * t;\n      mesh.children.forEach(child => {\n        if (child.userData && child.userData.speed !== undefined) {\n          child.rotation.y += child.userData.speed * t;\n        }\n      });\n    });\n    this.beltGroup.rotation.y += 0.006 * t;\n\n    if (this.state.selectedKey) {\n      const mesh = this.planetMeshes[this.state.selectedKey];\n      const worldPos = new THREE.Vector3();\n      mesh.getWorldPosition(worldPos);\n      if (!this.followOffset) {\n        const p = PLANETS.find(pp => pp.key === this.state.selectedKey);\n        const dir = worldPos.clone().normalize();\n        this.followOffset = dir.multiplyScalar(p.size * 4.5 + 3).add(new THREE.Vector3(0, p.size * 1.8 + 1.2, 0));\n      }\n      const camGoal = worldPos.clone().add(this.followOffset);\n      this.camera.position.lerp(camGoal, 0.05);\n      this.controls.target.lerp(worldPos, 0.08);\n    } else {\n      this.followOffset = null;\n      this.camera.position.lerp(this.overviewCamPos, 0.04);\n      this.controls.target.lerp(this.overviewTarget, 0.06);\n    }\n\n    this.controls.update();\n    this.renderer.render(this.scene, this.camera);\n  };\n\n  selectPlanet(key) {\n    this.followOffset = null;\n    this.setState({ selectedKey: key });\n  }\n\n  closePanel() {\n    this.followOffset = null;\n    this.setState({ selectedKey: null });\n  }\n\n  onSpeedChange(e) {\n    const v = parseFloat(e.target.value);\n    this.speedMultiplier = v;\n    this.setState({ speed: v });\n  }\n\n  componentWillUnmount() {\n    if (this.rafId) cancelAnimationFrame(this.rafId);\n    if (this.onResize) window.removeEventListener('resize', this.onResize);\n    if (this.resizeObserver) this.resizeObserver.disconnect();\n    if (this.renderer && this.onPointerMove) this.renderer.domElement.removeEventListener('pointermove', this.onPointerMove);\n    if (this.renderer) this.renderer.dispose();\n  }\n\n  renderVals() {\n    const selected = this.state.selectedKey ? PLANETS.find(p => p.key === this.state.selectedKey) : null;\n    const hovered = this.state.hoverKey ? PLANETS.find(p => p.key === this.state.hoverKey) : null;\n    return {\n      hasHover: !!hovered,\n      hoverName: hovered ? hovered.name : '',\n      hoverColor: hovered ? hovered.colorHex : '#5fd6ff',\n      hoverLeft: this.state.hoverX + 16,\n      hoverTop: this.state.hoverY - 12,\n      setMount: this.setMount,\n      loaded: this.state.loaded,\n      speed: this.state.speed,\n      speedLabel: this.state.speed.toFixed(1) + '×',\n      onSpeedChange: (e) => this.onSpeedChange(e),\n      hasSelection: !!selected,\n      selectedName: selected ? selected.name : '',\n      selectedGradient: selected ? `radial-gradient(circle at 32% 32%, ${selected.colorLight}, ${selected.colorHex})` : '',\n      selectedGlow: selected ? selected.colorHex + '66' : 'transparent',\n      selectedFunFact: selected ? selected.facts.funFact : '',\n      selectedStats: selected ? [\n        { label: 'Diameter', value: selected.facts.diameter },\n        { label: 'Distance from Sun', value: selected.facts.distance },\n        { label: 'Day Length', value: selected.facts.day },\n        { label: 'Year Length', value: selected.facts.year },\n        { label: 'Moons', value: String(selected.facts.moons) },\n      ] : [],\n      closePanel: () => this.closePanel(),\n      planetButtons: PLANETS.map(p => ({\n        name: p.name,\n        color: p.colorHex,\n        active: this.state.selectedKey === p.key ? '#ffffff' : 'rgba(255,255,255,.25)',\n        glow: this.state.selectedKey === p.key ? `0 0 10px ${p.colorHex}` : 'none',\n        onClick: () => this.selectPlanet(p.key),\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
